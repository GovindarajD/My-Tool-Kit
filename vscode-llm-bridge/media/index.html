<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VS Code LLM Bridge</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e1e;
    --panel: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --muted: #9d9d9d;
    --accent: #0e639c;
    --accent-hover: #1177bb;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --user-bubble: #2d3f52;
    --assistant-bubble: #2a2d2e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #healthBadge {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  #healthBadge.ok { border-color: var(--ok); color: var(--ok); }
  #healthBadge.bad { border-color: var(--err); color: var(--err); }
  #healthDetail { font-size: 11px; color: var(--muted); }

  #configBar {
    display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; align-items: center; background: var(--panel);
  }
  #configBar label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  select, input[type=text], input[type=number], textarea {
    background: #3c3c3c; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: 1px solid var(--accent); }

  #chat {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); }
  .msg.system { align-self: center; background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; max-width: 90%; }
  .msg.error { align-self: flex-start; background: rgba(248,81,73,0.12); border: 1px solid var(--err); color: var(--err); }
  .msgRole { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 4px; }
  .msgThumbs { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .msgThumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .cost { font-size: 10px; color: var(--warn); margin-top: 4px; }

  #composer {
    border-top: 1px solid var(--border); padding: 10px 16px; background: var(--panel);
    display: flex; flex-direction: column; gap: 8px;
  }
  #attachments { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 6px; background: #3c3c3c;
    border-radius: 12px; padding: 2px 8px 2px 2px; font-size: 11px;
  }
  .chip img { width: 22px; height: 22px; object-fit: cover; border-radius: 50%; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; }
  .chip button:hover { color: var(--err); }
  #inputRow { display: flex; gap: 8px; align-items: flex-end; }
  #promptInput { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; }
  button.primary, button.secondary {
    border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 600;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: #555; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: normal; }
  button.secondary:hover { color: var(--text); border-color: var(--text); }
  #attachBtn { align-self: center; }
  #errBanner {
    display: none; background: rgba(248,81,73,0.12); border: 1px solid var(--err); color: var(--err);
    padding: 6px 10px; border-radius: 4px; font-size: 12px;
  }
  .warningBanner {
    background: rgba(210,153,34,0.12); border-top: 1px solid var(--warn); border-bottom: 1px solid var(--warn);
    color: var(--warn); padding: 6px 16px; font-size: 12px;
  }
  .warningBanner a, .warningBanner code { color: inherit; }
  .msg.empty { border: 1px dashed var(--warn); color: var(--warn); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>VS Code LLM Bridge</h1>
    <span id="healthBadge">checking…</span>
    <span id="healthDetail"></span>
  </header>

  <div id="configBar">
    <label>Backend
      <select id="backendSelect">
        <option value="">vscode.lm (Copilot / other registered vendor)</option>
        <option value="anthropic">anthropic (direct API key)</option>
        <option value="claude-cli">claude-cli (your Claude subscription)</option>
      </select>
    </label>
    <label id="vendorRow">Vendor
      <select id="vendorSelect"></select>
    </label>
    <label>Model
      <select id="modelSelect"></select>
    </label>
    <label id="modelTextRow" style="display:none;">Model (optional)
      <input type="text" id="modelText" placeholder="leave blank for CLI default" />
    </label>
    <label>Max tokens
      <input type="number" id="maxTokens" value="1024" min="16" max="8192" style="width:80px;" />
    </label>
    <label>System prompt (optional)
      <input type="text" id="systemPrompt" placeholder="e.g. Answer concisely." style="width:220px;" />
    </label>
    <button class="secondary" id="clearBtn" type="button">Clear conversation</button>
  </div>

  <div id="vendorWarning" class="warningBanner" style="display:none;"></div>

  <div id="chat"></div>

  <div id="composer">
    <div id="errBanner"></div>
    <div id="attachments"></div>
    <div id="inputRow">
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />
      <button class="secondary" id="attachBtn" type="button" title="Attach image(s)">📎</button>
      <textarea id="promptInput" placeholder="Ask something… (Shift+Enter for newline, Enter to send)"></textarea>
      <button class="primary" id="sendBtn" type="button">Send</button>
    </div>
  </div>
</div>

<script>
(function () {
  const state = {
    messages: [],        // {role, content: string | ContentPart[]}
    attachments: [],      // {name, mime, dataUrl}
    vendorsData: null,    // last GET /vendors response
    sending: false,
  };

  const el = (id) => document.getElementById(id);
  const healthBadge = el('healthBadge');
  const healthDetail = el('healthDetail');
  const backendSelect = el('backendSelect');
  const vendorRow = el('vendorRow');
  const vendorSelect = el('vendorSelect');
  const modelSelect = el('modelSelect');
  const modelTextRow = el('modelTextRow');
  const modelText = el('modelText');
  const maxTokens = el('maxTokens');
  const systemPrompt = el('systemPrompt');
  const chat = el('chat');
  const attachmentsEl = el('attachments');
  const fileInput = el('fileInput');
  const attachBtn = el('attachBtn');
  const promptInput = el('promptInput');
  const sendBtn = el('sendBtn');
  const clearBtn = el('clearBtn');
  const errBanner = el('errBanner');
  const vendorWarning = el('vendorWarning');

  function showError(msg) {
    errBanner.textContent = msg;
    errBanner.style.display = msg ? 'block' : 'none';
  }

  async function refreshHealthAndVendors() {
    try {
      const [health, vendors] = await Promise.all([
        fetch('/health').then(r => r.json()),
        fetch('/vendors').then(r => r.json()),
      ]);
      state.vendorsData = vendors;
      healthBadge.textContent = health.available ? 'online' : 'no model signed in';
      healthBadge.className = health.available ? 'ok' : 'bad';
      const vendorCount = vendors.vendors ? vendors.vendors.length : 0;
      const modelCount = vendors.models ? vendors.models.length : 0;
      const bits = [
        `${vendorCount} vendor(s), ${modelCount} model(s) registered`,
        `Copilot picker: ${health.model || 'unknown'}`,
        `anthropic key: ${health.anthropicConfigured ? 'configured' : 'not set'}`,
        `claude-cli token: ${health.claudeCliConfigured ? 'configured' : 'not set'}`,
      ];
      healthDetail.textContent = bits.join(' · ');
      populateVendorSelect(vendors);
      populateModelSelect();
      updateVendorWarning();
    } catch (e) {
      healthBadge.textContent = 'offline';
      healthBadge.className = 'bad';
      healthDetail.textContent = 'Could not reach the bridge -- is the extension running?';
    }
  }

  function populateVendorSelect(vendors) {
    const previous = vendorSelect.value;
    vendorSelect.innerHTML = '';
    const list = (vendors && vendors.vendors && vendors.vendors.length) ? vendors.vendors : ['copilot'];
    for (const v of list) {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      vendorSelect.appendChild(opt);
    }
    vendorSelect.value = list.includes(previous) ? previous : (list.includes('copilot') ? 'copilot' : list[0]);
  }

  function populateModelSelect() {
    modelSelect.innerHTML = '';
    const backend = backendSelect.value;
    if (backend === 'anthropic') {
      const opt = document.createElement('option');
      opt.value = ''; opt.textContent = 'Loading Anthropic models…';
      modelSelect.appendChild(opt);
      fetch('/anthropic/models').then(r => r.json()).then(data => {
        modelSelect.innerHTML = '';
        const models = data.data || data.models || [];
        if (!models.length) {
          const o = document.createElement('option');
          o.value = ''; o.textContent = '(no models -- configure the Anthropic API key first)';
          modelSelect.appendChild(o);
          return;
        }
        for (const m of models) {
          const o = document.createElement('option');
          o.value = m.id || m; o.textContent = m.display_name || m.id || m;
          modelSelect.appendChild(o);
        }
      }).catch(() => {
        modelSelect.innerHTML = '<option value="">(unavailable -- set the Anthropic API key first)</option>';
      });
      return;
    }
    // vscode.lm backend: filter the /vendors model list by the selected vendor
    const vendor = vendorSelect.value || 'copilot';
    const defaultOpt = document.createElement('option');
    defaultOpt.value = ''; defaultOpt.textContent = '(vendor default)';
    modelSelect.appendChild(defaultOpt);
    const models = (state.vendorsData && state.vendorsData.models) || [];
    for (const m of models.filter(m => m.vendor === vendor)) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = `${m.name} (${m.id})${m.canSendRequest === false ? ' -- access denied' : ''}`;
      modelSelect.appendChild(o);
    }
  }

  function updateVendorWarning() {
    const backend = backendSelect.value;
    if (backend !== '' || vendorSelect.value === 'copilot' || !vendorSelect.value) {
      vendorWarning.style.display = 'none';
      return;
    }
    vendorWarning.style.display = 'block';
    vendorWarning.innerHTML =
      `&#9888; Vendor <code>${vendorSelect.value}</code> is registered but, per exhaustive testing ` +
      `(see <code>agent_usage_guide.md</code> Step 6), any vscode.lm vendor other than <code>copilot</code> ` +
      `resolves and completes with <strong>zero output and no error</strong> -- this is a closed-implementation ` +
      `choice on that provider's side, not something this bridge can fix. If you're trying to reach Claude ` +
      `specifically, switch <strong>Backend</strong> above to "claude-cli" (uses your subscription) or ` +
      `"anthropic" (direct API key) instead -- those are genuinely independent, working paths.`;
  }

  function updateBackendUi() {
    const backend = backendSelect.value;
    vendorRow.style.display = backend === '' ? '' : 'none';
    modelSelect.style.display = backend === 'claude-cli' ? 'none' : '';
    modelTextRow.style.display = backend === 'claude-cli' ? '' : 'none';
    populateModelSelect();
    updateVendorWarning();
  }

  backendSelect.addEventListener('change', updateBackendUi);
  vendorSelect.addEventListener('change', () => { populateModelSelect(); updateVendorWarning(); });

  function renderAttachments() {
    attachmentsEl.innerHTML = '';
    state.attachments.forEach((a, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const img = document.createElement('img');
      img.src = a.dataUrl;
      const label = document.createElement('span');
      label.textContent = a.name;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.addEventListener('click', () => {
        state.attachments.splice(i, 1);
        renderAttachments();
      });
      chip.appendChild(img); chip.appendChild(label); chip.appendChild(removeBtn);
      attachmentsEl.appendChild(chip);
    });
  }

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    for (const file of fileInput.files) {
      const reader = new FileReader();
      reader.onload = () => {
        state.attachments.push({ name: file.name, mime: file.type, dataUrl: reader.result });
        renderAttachments();
      };
      reader.readAsDataURL(file);
    }
    fileInput.value = '';
  });

  function appendMessageBubble(role, text, thumbs) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const roleLabel = document.createElement('div');
    roleLabel.className = 'msgRole';
    roleLabel.textContent = role;
    div.appendChild(roleLabel);
    const body = document.createElement('div');
    body.className = 'msgBody';
    body.textContent = text;
    div.appendChild(body);
    if (thumbs && thumbs.length) {
      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'msgThumbs';
      for (const t of thumbs) {
        const img = document.createElement('img');
        img.src = t;
        thumbWrap.appendChild(img);
      }
      div.appendChild(thumbWrap);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return body;
  }

  function currentRequestBody(userContent) {
    const messages = [];
    const sys = systemPrompt.value.trim();
    if (sys) { messages.push({ role: 'system', content: sys }); }
    messages.push(...state.messages);
    messages.push({ role: 'user', content: userContent });

    const backend = backendSelect.value;
    const body = {
      messages,
      stream: true,
      max_tokens: parseInt(maxTokens.value, 10) || 1024,
    };
    if (backend) { body.backend = backend; }
    if (backend === 'anthropic') {
      body.model = modelSelect.value;
    } else if (backend === 'claude-cli') {
      if (modelText.value.trim()) { body.model = modelText.value.trim(); }
    } else {
      body.vendor = vendorSelect.value || 'copilot';
      if (modelSelect.value) { body.model = modelSelect.value; }
    }
    return body;
  }

  async function send() {
    if (state.sending) { return; }
    const text = promptInput.value.trim();
    if (!text && !state.attachments.length) { return; }
    showError('');

    let userContent;
    const thumbs = state.attachments.map(a => a.dataUrl);
    if (state.attachments.length) {
      userContent = [{ type: 'text', text: text || '(no text -- see attached image(s))' }];
      for (const a of state.attachments) {
        userContent.push({ type: 'image_url', image_url: { url: a.dataUrl } });
      }
    } else {
      userContent = text;
    }

    appendMessageBubble('user', text || '(image only)', thumbs);
    const requestBody = currentRequestBody(userContent);
    state.messages.push({ role: 'user', content: userContent });
    promptInput.value = '';
    state.attachments = [];
    renderAttachments();

    state.sending = true;
    sendBtn.disabled = true;
    sendBtn.textContent = 'Thinking…';
    const assistantBody = appendMessageBubble('assistant', '');
    let assistantText = '';
    let costEl = null;

    try {
      const resp = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      });
      if (!resp.ok) {
        const errJson = await resp.json().catch(() => ({}));
        throw new Error(errJson.error || `HTTP ${resp.status}`);
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) { break; }
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data: ')) { continue; }
          const data = trimmed.slice(6).trim();
          if (data === '[DONE]') { continue; }
          let chunk;
          try { chunk = JSON.parse(data); } catch { continue; }
          if (chunk.error) { throw new Error(chunk.error); }
          const delta = (chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || '';
          if (delta) {
            assistantText += delta;
            assistantBody.textContent = assistantText;
            chat.scrollTop = chat.scrollHeight;
          }
          if (chunk.usage && chunk.usage.total_cost_usd != null) {
            if (!costEl) {
              costEl = document.createElement('div');
              costEl.className = 'cost';
              assistantBody.parentElement.appendChild(costEl);
            }
            costEl.textContent = `cost: $${chunk.usage.total_cost_usd.toFixed(6)}`;
          }
        }
      }
      if (!assistantText) {
        // A "successful" request that streamed zero characters and never sent
        // an {"error": ...} chunk is exactly what the vscode.lm "claude-code"/
        // "copilotcli" vendors do (see agent_usage_guide.md Step 6) -- without
        // this notice it's indistinguishable from a hang. Never push an empty
        // string into history either, since that would silently confuse the
        // next turn's context.
        assistantBody.parentElement.classList.add('empty');
        const vendor = (requestBody.backend ? requestBody.backend : requestBody.vendor) || 'copilot';
        assistantBody.textContent = requestBody.backend
          ? `(empty response -- backend "${vendor}" returned no content and no error)`
          : (vendor === 'copilot'
            ? '(empty response -- no content and no error; check GET /health for availability)'
            : `(empty response -- vendor "${vendor}" is a known dead end via vscode.lm; see the warning above and switch Backend to "claude-cli" or "anthropic" instead)`);
      } else {
        state.messages.push({ role: 'assistant', content: assistantText });
      }
    } catch (e) {
      assistantBody.parentElement.classList.add('error');
      assistantBody.textContent = assistantText || `Error: ${e.message}`;
      showError(e.message);
      if (assistantText) { state.messages.push({ role: 'assistant', content: assistantText }); }
    } finally {
      state.sending = false;
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      promptInput.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  clearBtn.addEventListener('click', () => {
    state.messages = [];
    chat.innerHTML = '';
    showError('');
  });

  updateBackendUi();
  refreshHealthAndVendors();
  setInterval(refreshHealthAndVendors, 15000);
})();
</script>
</body>
</html>
